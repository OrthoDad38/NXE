<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' kratos-art:; media-src kratos-art:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Project Kratos - Xbox 360 Dashboard Launcher</title>
  <link rel="stylesheet" href="styles.css">
  <script src="ui-sounds.js" defer></script>
</head>
<body>
  <img id="theme-wallpaper" class="hidden" alt="" aria-hidden="true">
  <header>
    <div class="dashboard-nav"><span class="nav-faint">Project Kratos</span><span class="nav-muted">Your collection</span><div class="brand"><div class="brand-title">Game Library</div></div></div>
    <div class="controls-hint">
      <button id="admin-button" class="key-badge" type="button">Admin</button>
      <span><span class="key-badge">D-PAD</span> Scroll</span>
      <span><span class="controller-button button-a" role="img" aria-label="A"><img src="assets/controller-buttons.jpg" alt="" draggable="false"></span> Select Game</span>
      <span><span class="key-badge">LB / RB</span> Jump 5</span>
    </div>
  </header>
  <div class="active-title-display">
    <div class="active-title-text" id="active-title">Loading Library...</div>
    <div class="active-subtitle" id="subtitle">Press A to Launch</div>
  </div>
  <div class="carousel-stage"><div class="carousel-track" id="carousel-track"></div></div>
  <div id="counter" class="library-counter"></div>
  <footer><div class="footer-controls"><span><span class="controller-button button-a" role="img" aria-label="A"><img src="assets/controller-buttons.jpg" alt="" draggable="false"></span> Select</span><span><span class="key-badge">D-PAD</span> Browse</span><span><span class="key-badge">LB / RB</span> Jump 5</span></div><span id="controller-status">Connect an Xbox controller and press a button</span></footer>
  <div class="dashboard-corner" aria-hidden="true">
    <svg class="corner-ripples" viewBox="0 0 210 100" xmlns="http://www.w3.org/2000/svg">
      <defs><radialGradient id="ripple-light"><stop offset="0" stop-color="#c5d2c4" stop-opacity=".08"/><stop offset="1" stop-color="#c5d2c4" stop-opacity="0"/></radialGradient><filter id="ripple-soft"><feGaussianBlur stdDeviation=".7"/></filter></defs>
      <ellipse cx="105" cy="54" rx="92" ry="34" fill="url(#ripple-light)"/>
      <g fill="none" stroke="#b7c5b5" stroke-width="1.6" filter="url(#ripple-soft)">
        <ellipse cx="105" cy="54" rx="86" ry="30" opacity=".09"/>
        <ellipse cx="105" cy="54" rx="75" ry="25" opacity=".12"/>
        <ellipse cx="105" cy="54" rx="62" ry="20" opacity=".16"/>
        <ellipse cx="105" cy="54" rx="50" ry="15" opacity=".19"/>
        <ellipse cx="105" cy="54" rx="35" ry="10" opacity=".22"/>
        <ellipse cx="105" cy="54" rx="22" ry="6" opacity=".18"/>
      </g>
    </svg>
    <div class="corner-logo-shadow"></div>
    <div class="dashboard-orb"><img src="assets/xbox-orb.jpg" alt="" draggable="false"></div>
  </div>
  <div id="status" role="status" aria-live="polite"></div>
  <div id="launch-overlay" class="hidden" role="status" aria-live="polite">
    <div><div class="brand-logo">X</div><h1 id="launch-title"></h1><p>Starting your game…</p></div>
  </div>
  <div id="overlay" class="hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <section class="panel">
      <button id="close-admin" type="button" class="close-admin" aria-label="Close administrator panel">Close</button>
      <h1 id="modal-title"></h1><p id="modal-help"></p>
      <div id="modal-content"></div><div id="modal-error" role="alert"></div>
    </section>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
