<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src kratos-art:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Project Kratos - Xbox 360 Dashboard Launcher</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="brand"><div class="brand-logo">X</div><div class="brand-title">Xbox 360 Games</div></div>
    <div class="controls-hint">
      <button id="admin-button" class="key-badge" type="button">Admin</button>
      <span><span class="key-badge">D-PAD</span> Scroll</span>
      <span><span class="key-badge key-a">A</span> Select Game</span>
      <span><span class="key-badge">LB / RB</span> Jump 5</span>
    </div>
  </header>
  <div class="active-title-display">
    <div class="active-title-text" id="active-title">Loading Library...</div>
    <div class="active-subtitle" id="subtitle">Press A to Launch</div>
  </div>
  <div class="carousel-stage"><div class="carousel-track" id="carousel-track"></div></div>
  <footer><span id="controller-status">Connect an Xbox controller and press a button</span><span id="counter"></span></footer>
  <div id="status" role="status" aria-live="polite"></div>
  <div id="launch-overlay" class="hidden" role="status" aria-live="polite">
    <div><div class="brand-logo">X</div><h1 id="launch-title"></h1><p>Starting your game…</p></div>
  </div>
  <div id="overlay" class="hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <section class="panel">
      <button id="close-admin" type="button" class="close-admin" aria-label="Close administrator panel">Close</button>
      <h1 id="modal-title"></h1><p id="modal-help"></p>
      <div id="modal-content"></div><div id="modal-error" role="alert"></div>
    </section>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
